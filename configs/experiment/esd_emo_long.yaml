# @package _global_

# ESD 情感模型长程训练（~1200 epoch，对齐官方 500k updates 量级）
# =====================================================================
# 推荐用法：从本地 ep127 last.ckpt 直接进入长跑（避免衰减后再回跳）
#   python matcha/train.py experiment=esd_emo_long \
#          ckpt_path=/data/ckpts/esd_emo_ep127_last.ckpt
#
# 也支持从头训：python matcha/train.py experiment=esd_emo_long
# （同一份里程碑 [600,900,1050,1150] 写在全局轴，从哪开始都成立）
#
# 时间预算：519 步/epoch × 1200 ≈ 62 万步。按本地 3.7 min/epoch 约 74 小时；
# 服务器 GPU 更快则按比例缩短。中断后用同一命令 + 新 run 的 last.ckpt 续跑。

defaults:
  - override /data: esd.yaml
  - override /model/scheduler: multistep_long.yaml

tags: ["esd", "emotion", "long"]
run_name: esd_emo_long

model:
  # 情感条件（与 ep127 主训练完全一致，保证权重可恢复）
  emo_dim: 768
  emo_emb_dim: 64
  emo_cond_dropout: 0.1
  emo_aux_loss: 0.2

trainer:
  max_epochs: 1200

test: false   # 模型类无 test_step，默认 test:true 会在训练结束后崩掉（不影响权重）

callbacks:
  model_checkpoint:
    # 归档快照：每 50 epoch 存一个编号 ckpt，保留最近 8 个（跨度 400 epoch，8×258MB≈2GB）
    every_n_epochs: 50
    save_top_k: 8
    save_last: false   # 过期的 last 副本只会误导续训（新鲜的在 checkpoints_last/）
  resume_checkpoint:
    # 断点续训专用：每 epoch 存编号 ckpt（top_k=1 只留最新）+ last.ckpt。
    # 教训（09-14）：save_top_k=0 + save_last 的组合在 Lightning 2.6.6 上不落盘——
    # last.ckpt 只在"当轮存过编号 checkpoint"时才写入（仓库已知行为），必须 top_k>=1
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints_last
    filename: ckpt_{epoch:03d}
    monitor: epoch
    mode: max
    auto_insert_metric_name: false
    save_top_k: 1
    save_last: true
    every_n_epochs: 1
