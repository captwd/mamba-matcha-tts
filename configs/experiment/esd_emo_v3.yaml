# @package _global_

# ESD 情感模型 v3：从 v1 的 ep1199 继续训练，LR 调大
# =====================================================================
# 起点：esd_emo_long 的 checkpoint_epoch=1199.ckpt（v1 收在 lr 6.25e-6）
# 本配置把 lr 提到 3e-5 恒定，监控/早停沿用 v2 的修正（盯 val_mcd）。
#
# 用法：python matcha/train.py experiment=esd_emo_v3 \
#           ckpt_path=/root/Matcha-TTS/logs/train/esd_emo_long/runs/2026-09-14_23-41-59/checkpoints/checkpoint_epoch=1199.ckpt

defaults:
  - override /data: esd.yaml
  # scheduler 保持默认 null：恒定 lr

tags: ["esd", "emotion", "v3"]
run_name: esd_emo_v3

model:
  emo_dim: 768
  emo_emb_dim: 64
  emo_cond_dropout: 0.1
  emo_aux_loss: 0.2
  optimizer:
    lr: 3.0e-5   # 从 6.25e-6 的终点"稍微调大"

trainer:
  max_epochs: 300

callbacks:
  model_checkpoint:
    monitor: val_mcd/mean
    mode: min
    save_top_k: 2
    save_last: false
    every_n_epochs: 1
    filename: best_ep{epoch:03d}_{val_mcd/mean:.2f}
    auto_insert_metric_name: false
  resume_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints_last
    filename: ckpt_{epoch:03d}
    monitor: epoch
    mode: max
    auto_insert_metric_name: false
    save_top_k: 1
    save_last: true
    every_n_epochs: 1
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val_mcd/mean
    mode: min
    patience: 80
    min_delta: 0.0
    verbose: true

test: false
