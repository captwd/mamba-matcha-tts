# @package _global_

# ESD 情感模型 v2：盯 val_mcd 训到收敛（修正 v1 的过拟合教训）
# =====================================================================
# v1（esd_emo_long，1200 轮）的结论：val_mcd 在 ep349 触底 54.39 后持续
# 过拟合爬升到 62.0，而 checkpoint 按 epoch 保留，最优点没有存下来。
#
# 本配置的修正：
#   1. model_checkpoint 盯 val_mcd/mean（mode=min），保留最好的 2 个；
#   2. EarlyStopping patience=80：过峰后 80 轮无改善自动停；
#   3. 恒定 lr 1e-4、不挂 scheduler——复现 v1 中 ep349 最优出现时的训练条件；
#   4. max_epochs=450 封顶（最优点的 1.3 倍余量）。
#
# 用法：python matcha/train.py experiment=esd_emo_v2

defaults:
  - override /data: esd.yaml
  # scheduler 保持默认 null：恒定 LR

tags: ["esd", "emotion", "v2"]
run_name: esd_emo_v2

model:
  emo_dim: 768
  emo_emb_dim: 64
  emo_cond_dropout: 0.1
  emo_aux_loss: 0.2

trainer:
  max_epochs: 450

callbacks:
  model_checkpoint:
    # 最优谱质量快照：盯 val_mcd/mean，保留最好的 2 个（2×258MB）
    monitor: val_mcd/mean
    mode: min
    save_top_k: 2
    save_last: false
    every_n_epochs: 1
    filename: best_ep{epoch:03d}_{val_mcd/mean:.2f}
    auto_insert_metric_name: false
  resume_checkpoint:
    # 断点续训专用：每 epoch 存编号 ckpt（top_k=1）+ last.ckpt
    # （注意 save_top_k=0 + save_last 在 Lightning 2.6.6 不落盘，见 v1 教训）
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints_last
    filename: ckpt_{epoch:03d}
    monitor: epoch
    mode: max
    auto_insert_metric_name: false
    save_top_k: 1
    save_last: true
    every_n_epochs: 1
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val_mcd/mean
    mode: min
    patience: 80
    min_delta: 0.0
    verbose: true

test: false   # 模型类无 test_step（同 v1 教训）
