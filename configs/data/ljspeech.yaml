_target_: matcha.data.text_mel_datamodule.TextMelDataModule
name: ljspeech
train_filelist_path: data/LJSpeech-1.1/train.txt
valid_filelist_path: data/LJSpeech-1.1/val.txt
batch_size: 32
num_workers: 4
pin_memory: True
cleaners: [english_cleaners2]
add_blank: True
n_spks: 1
n_fft: 1024
n_feats: 80
sample_rate: 22050
hop_length: 256
win_length: 1024
f_min: 0
f_max: 8000
data_statistics:  # Computed for ljspeech dataset
  mel_mean: -5.536622
  mel_std: 2.116101
seed: ${seed}
load_durations: false
# 情感条件数据：emo_dim 与 model.emo_dim 对齐；emo_feat_dir 存放 {utt_id}.npy 的 emotion2vec 句级向量
# emo_feat_dir: null 时返回全零占位向量（仅用于跑通流程）
emo_dim: ${model.emo_dim}
emo_feat_dir: null
# 情感类别数：model.n_emotions 引用本键；主线（无情感任务）置 0 即不创建辅助分类器
n_emotions: 0
